[project]
name = "secret-manager"
version = "0.1.0"
description = "ADHD Framework manager: secret_manager"
requires-python = ">=3.11"
dependencies = [
    "logger-util",
    "exceptions-core",
    "cli-manager",
    "PyYAML>=6.0",
]

[project.urls]
Repository = "https://github.com/AI-Driven-Highspeed-Development/secret_manager"

[tool.adhd]
layer = "foundation"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.hatch.build]
dev-mode-dirs = [".."]

[tool.uv.sources]
logger-util = { workspace = true }
exceptions-core = { workspace = true }
cli-manager = { workspace = true }
